<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="mobile-web-app-capable" content="yes">
<title>Qalam</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash" class="splash" role="status" aria-label="Qalam is loading">
  <img src="img/icon.png" alt="">
  <span>Qalam</span>
</div>

<!-- ───────────────────────── gallery ───────────────────────── -->
<section id="gallery" class="screen">
  <header class="gal-head">
    <div class="brand">
      <div class="brand-mark"><img src="img/icon.png" alt=""></div>
      <div class="brand-txt">
        <h1>Qalam</h1>
        <span>Your creative workspace</span>
      </div>
    </div>
  </header>

  <main class="gallery-content">
    <div class="gal-create">
      <div><span class="gal-eyebrow">YOUR STUDIO</span><h2>Make something new.</h2><p>Your artwork, all in one place.</p></div>
      <button id="btnNew" class="btn primary">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New canvas
      </button>
    </div>
    <div id="galGrid" class="gal-grid"></div>

  <div id="galEmpty" class="gal-empty">
    <div class="gal-empty-art" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="9" y="8" width="30" height="32" rx="3"/><path d="M15 32l7-8 5 5 4-4 4 7M16 17h.1"/></svg></div>
    <h2>Your studio is empty</h2>
    <p>Make a canvas and start painting. Artwork, layers and animation frames stay on this device.</p>
  </div>
  </main>
</section>

<!-- ───────────────────────── studio ───────────────────────── -->
<section id="studio" class="screen hidden">
  <canvas id="view"></canvas>
  <input id="imageImport" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <input id="audioImport" type="file" accept="audio/*" hidden>

  <div class="topbar" role="toolbar" aria-label="Studio controls">
    <button class="icon-btn" id="btnGallery" aria-label="Gallery" title="Gallery">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-btn" id="btnMenu" aria-expanded="false" aria-label="Actions" title="Actions">
      <svg viewBox="0 0 24 24"><path d="M14.5 6a4.5 4.5 0 00-5.7 5.7L3 17.5 6.5 21l5.8-5.8A4.5 4.5 0 0018 9l-3 2-2-2z"/></svg>
    </button>
    <button class="icon-btn" id="btnEffects" aria-label="Effects" title="Effects">
      <svg viewBox="0 0 24 24"><path d="M4 20l11-11M12 5l.8-2 .8 2 2 .8-2 .8-.8 2-.8-2-2-.8zM18 12l.7-2 .7 2 2 .7-2 .7-.7 2-.7-2-2-.7z"/></svg>
    </button>
    <button class="icon-btn" id="btnSelection" aria-label="Selection and transform" title="Selection and transform">
      <svg viewBox="0 0 24 24"><path d="M4 8V5h3M10 5h4M17 5h3v3M20 11v4M20 18v2h-3M14 20h-4M7 20H4v-3M4 14v-3"/></svg>
    </button>
    <div class="title-wrap">
      <input id="docTitle" type="text" value="Untitled" aria-label="Artwork name" spellcheck="false" autocomplete="off">
      <span id="docMeta">2048 × 2048</span>
    </div>
    <button class="icon-btn" id="btnUndo" aria-label="Undo" title="Undo">
      <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a5 5 0 010 10h-2"/></svg>
    </button>
    <button class="icon-btn" id="btnRedo" aria-label="Redo" title="Redo">
      <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a5 5 0 000 10h2"/></svg>
    </button>
    <button class="icon-btn" id="btnTimeline" aria-label="Timeline" title="Animation timeline">
      <svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18"/><circle cx="7" cy="9" r="1.6"/><circle cx="14" cy="15" r="1.6"/></svg>
    </button>
  </div>

  <div class="rail rail-left">
    <button class="rail-btn" id="btnBrush" aria-expanded="false" aria-label="Brushes">
      <svg viewBox="0 0 24 24"><path d="M4 20c3 0 4-2 4-4 0-1.4-.8-2.4-2-2.6C4.6 13.1 4 12 4 11c0 0 2 .4 3.2 1.6C8.8 14.2 9 16 9 16s2.4.2 4.2-1.6C15 12.6 19 4 19 4s1.6 5.6-1.4 9.4C15.4 16 12.4 16.4 10.6 18c-1.2 1.1-2.6 2-6.6 2z"/></svg>
    </button>

    <div class="vslider" id="sizeWrap">
      <input id="sizeSlider" aria-label="Brush size" type="range" min="1" max="240" value="14">
      <div class="vslider-val" id="sizeVal">14</div>
    </div>
    <button class="swatch" id="btnColor" aria-expanded="false" aria-label="Colour" title="Colour · drag to fill or hold for previous colour"></button>
    <div class="vslider" id="opacityWrap">
      <input id="opacitySlider" aria-label="Brush opacity" type="range" min="1" max="100" value="100">
      <div class="vslider-val" id="opacityVal">100</div>
    </div>
  </div>

  <div class="rail rail-right">
    <button class="rail-btn" id="btnEyedrop" aria-label="Eyedropper">
      <svg viewBox="0 0 24 24"><path d="M15 4l5 5-9 9-3 .8.8-3z"/><path d="M13 6l5 5"/></svg>
    </button>
    <button class="rail-btn" id="btnFill" aria-label="Fill tool">
      <svg viewBox="0 0 24 24"><path d="M4 13l7-7 7 7-7 7zM7 4l4 4M4 13h14M20 16c0 1.5-1.2 2.5-1.2 3.3a1.2 1.2 0 002.4 0c0-.8-1.2-1.8-1.2-3.3z"/></svg>
    </button>
    <button class="rail-btn" id="btnSmudge" aria-label="Smudge" title="Smudge active layer" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M8 12V5a2 2 0 014 0v5-3a2 2 0 014 0v4-2a2 2 0 014 0v6c0 4-2 6-6 6h-2c-3 0-4-2-5-4l-2-3c-1-2 1-3 3-2z"/></svg>
    </button>
    <button class="rail-btn" id="btnEraser" aria-label="Eraser" title="Tap eraser; hold to match the current brush" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M3 15l9-9a2 2 0 013 0l5 5-8 9H8zM8 10l7 7M11 20h10"/></svg>
    </button>
    <button class="rail-btn" id="btnFitCanvas" aria-label="Fit canvas" title="Fit canvas and reset rotation">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
    </button>
    <button class="rail-btn" id="btnLayers" aria-expanded="false" aria-label="Layers">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
  </div>

  <div id="tray" class="tray hidden"><div id="trayBody" class="tray-body"></div></div>
  <div id="timeline" class="timeline hidden"></div>
  <button id="btnRestoreInterface" class="focus-restore hidden" aria-label="Show interface" title="Show interface">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path d="M8 12h8M12 8v8"/></svg>
  </button>
  <div id="hint" class="hint"></div>
  <aside id="referenceWindow" class="reference-window hidden" aria-label="Canvas reference">
    <div id="referenceHandle" class="reference-head"><strong id="referenceTitle">Canvas reference</strong><button id="referenceClose" aria-label="Close reference">×</button></div>
    <div class="reference-actions">
      <button id="referenceCanvasMode" aria-label="Show canvas reference" title="Show canvas reference"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-4 4 3 3-3 6 5"/></svg></button>
      <button id="referencePickImage" aria-label="Choose reference image" title="Choose reference image"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M4 14v6h16v-6"/></svg></button>
    </div>
    <div class="reference-view"><canvas id="referenceCanvas"></canvas></div>
    <label class="reference-zoom">Zoom <input id="referenceZoom" type="range" min="100" max="300" value="100" aria-label="Reference zoom"></label>
  </aside>
</section>

<div id="toast" class="toast"></div>
<!-- Shared by gallery and studio: it must not be a child of the hidden studio. -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modalBody"></div></div>

<script src="js/core.js"></script>
<script src="js/doc.js"></script>
<script src="js/brushes.js"></script>
<script src="js/gif.js"></script>
<script src="js/effects.js"></script>
<script src="js/fill.js"></script>
<script src="js/selection.js"></script>
<script src="js/spritesheet.js"></script>
<script src="js/view.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
