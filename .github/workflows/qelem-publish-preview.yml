name: Publish Qelem 1.5 Android preview to branch
on:
  push:
    branches: [arena/412bd2e9-prodesign]
    paths: ['.github/workflows/qelem-publish-preview.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/412bd2e9-prodesign
      - uses: actions/download-artifact@v4
        with:
          name: Qelem-native-preview-arm64
          path: /tmp/qelem-native
          run-id: 43639477326
          github-token: ${{ github.token }}
      - name: Verify Qelem 1.5 Android preview
        run: |
          set -euo pipefail
          (cd /tmp/qelem-native && sha256sum -c SHA256SUMS.txt)
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=/tmp/qelem-native/Qelem-native-preview-arm64.apk
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/signature.txt
          "$TOOLS/aapt" dump badging "$APK" > /tmp/badging.txt
          grep "package: name='com.qalam.studio.nativepreview.debug' versionCode='10500012' versionName='1.5-preview'" /tmp/badging.txt
          grep "native-code: 'arm64-v8a'" /tmp/badging.txt
          unzip -l "$APK" | grep 'lib/arm64-v8a/libprocraft_core.so'
          cp "$APK" artifacts/releases/Qelem-1.5-preview-Android-arm64.apk
          {
            echo 'Qelem 1.5 Android native development preview'
            echo 'Source commit: a6f79bb3164dd54b487523996a399ae55a6acd30'
            echo 'Android build: https://github.com/mubareksam/Qelem/actions/runs/43639477326'
            echo 'Debug signed, separate package, no old Qelem gallery importer. Not an upgrade.'
            echo 'No physical device verification. Back up artwork; keep the original app installed.'
            (cd artifacts/releases && sha256sum Qelem-1.5-preview-Android-arm64.apk)
            cat /tmp/signature.txt
            grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:|native-code:)" /tmp/badging.txt
          } > artifacts/releases/Qelem-1.5-preview-Android-arm64.txt
      - name: Commit preview to current branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/releases/Qelem-1.5-preview-Android-arm64.apk artifacts/releases/Qelem-1.5-preview-Android-arm64.txt
          git commit -m 'Add Qelem 1.5 Android native preview APK'
          git push origin HEAD:arena/412bd2e9-prodesign
