name: Qelem native preview APK

# A branch push may build this isolated development APK. No release is published automatically.
on:
  push:
    branches: [arena/412bd2e9-prodesign]
    paths:
      - 'native/**'
      - '.github/workflows/qelem-native-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          cache-on-failure: true
      - name: Install cargo-ndk
        run: |
          set +e
          cargo install cargo-ndk --version '^4' --locked > /tmp/qelem-cargo-install.log 2>&1
          result=$?
          tail -n 30 /tmp/qelem-cargo-install.log
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 8 /tmp/qelem-cargo-install.log)
            exit "$result"
          fi
      - name: Install Android SDK packages
        run: |
          set +e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'ndk;29.0.14206865' > /tmp/qelem-sdk-install.log 2>&1
          result=$?
          tr '\r' '\n' < /tmp/qelem-sdk-install.log | tail -n 30
          if [ "$result" -ne 0 ]; then
            tr '\r' '\n' < /tmp/qelem-sdk-install.log | grep -Ei 'error|warning|failed|license|not found|unable|exception|package' | tail -n 12 > /tmp/qelem-sdk-errors.log || true
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/qelem-sdk-errors.log
            exit "$result"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build arm64 development APK and test animation helpers
        working-directory: native/android
        run: |
          set +e
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest --tests '*QelemPreviewTest' -Pprocraft.abis=arm64-v8a > /tmp/qelem-gradle.log 2>&1
          result=$?
          tail -n 100 /tmp/qelem-gradle.log
          if [ "$result" -ne 0 ]; then
            echo "::error::Gradle exited with status $result"
            python3 - <<'PYLOG'
          import re
          lines = open('/tmp/qelem-gradle.log', errors='replace').read().splitlines()
          lines = [s for s in lines if not re.match(r'^\s*(Compiling |Downloading |Downloaded |> Task )', s)]
          summary = '\n'.join(lines[-70:])[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + summary)
          PYLOG
            exit "$result"
          fi
      - name: Save APK and checksum
        run: |
          mkdir -p apk
          cp native/android/app/build/outputs/apk/debug/app-debug.apk apk/Qelem-native-preview-arm64.apk
          (cd apk && sha256sum Qelem-native-preview-arm64.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Qelem-native-preview-arm64
          path: apk/
          if-no-files-found: error
          retention-days: 14
